services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - notes_network

  backend:
    build: ./interactive_notes
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DJANGO_SSL_REQUIRE=0
    depends_on:
      - db
    networks:
      - notes_network


networks:
  notes_network:
    driver: bridge


volumes:
  postgres_data:
